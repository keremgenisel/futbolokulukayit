# Sürüm yayını: bir "v*" etiketi (tag) push edilince Windows kurulumu derlenir ve
# GitHub Release olarak yayınlanır (electron-updater bunu otomatik güncelleme kaynağı
# olarak kullanır; bkz. package.json build.publish + scripts/publish-release.cjs).
#
# Kullanım (yerel):
#   1) package.json "version" ve (tek kaynak)
#   2) git commit + git tag vX.Y.Z && git push --follow-tags
#   Etiket push'u bu iş akışını tetikler; başka bir şey yapmaya gerek yok.
#
# Neden Windows runner: electron-builder NSIS kurulumunu (.exe) native olarak yalnız
# Windows'ta üretir; better-sqlite3 postinstall'da o platformun ABI'sine derlenir.
name: release

on:
  push:
    tags: ["v*"]

# İki depo düzeni: bu (ÖZEL) depoda derlenir, kurulum dosyaları HERKESE AÇIK keremgenisel/eyupspor-releases
# deposuna yüklenir (package.json build.publish). Başka depoya yazmak için GITHUB_TOKEN yetmez: RELEASES_TOKEN
# gizli ayarı (classic PAT, yalnız "public_repo" yetkisi) gerekir — Settings > Secrets and variables > Actions.
permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Etiket ile package.json sürümü uyuşmazsa dur: publish-release.cjs asset adlarını
      # ve TAG'i package.json version'dan üretir; uyumsuzluk bozuk/yanlış bir release yaratır.
      - name: Etiket-sürüm uyumu
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Etiket (${GITHUB_REF_NAME}) ile package.json sürümü (v$PKG) uyuşmuyor. Önce package.json version'ı güncelleyip commit'leyin."
            exit 1
          fi

      - name: RELEASES_TOKEN var mı
        shell: bash
        run: |
          if [ -z "${{ secrets.RELEASES_TOKEN }}" ]; then
            echo "::error::RELEASES_TOKEN gizli ayarı yok. GitHub > Settings > Developer settings > Personal access tokens (classic) > public_repo yetkili token üretip bu deponun Secrets kısmına RELEASES_TOKEN adıyla ekleyin (plan §8.1)."
            exit 1
          fi

      - run: npm ci

      # release scripti: vite build + electron-builder --win --publish never +
      # scripts/publish-release.cjs (idempotent yayınlayıcı; token'ı GH_TOKEN'dan okur, yayın deposu build.publish.repo).
      - name: Derle ve eyupspor-releases deposuna yayınla
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
