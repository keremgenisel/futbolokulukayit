# CodeQL — GitHub'ın kod tarama motoru: kaynakta güvenlik açığı KALIPLARINI arar (enjeksiyon, yol geçişi,
# güvensiz rastgelelik, doğrulanmamış girdi…). Bulgular depo > Security > Code scanning alerts'e düşer;
# iş akışı bulgu yüzünden KIRMIZI olmaz (uyarılar Security sekmesinde izlenir).
# İki dil: javascript-typescript (src, electron, scripts) ve actions (.github/workflows dosyalarının kendisi).
# Not: daha geniş tarama istenirse init adımına `queries: security-extended` eklenir (daha çok yanlış pozitif).
name: codeql

on:
  push:
  pull_request:
  schedule:
    - cron: "0 7 * * 1" # her Pazartesi 07:00 UTC — yeni sorgular kod değişmeden yeni bulgu verebilir
  workflow_dispatch:

jobs:
  analiz:
    name: analiz (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # bulguları Code scanning'e yazar
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "actions"]
    steps:
      - uses: actions/checkout@v7

      - name: CodeQL kurulumu
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none # JS/TS ve Actions için derleme gerekmez (yorumlanan diller)

      - name: Analiz
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
