# Semgrep OSS — açık kaynak statik analiz motoru; CodeQL'e ikinci bir göz olarak kural paketleriyle tarar
# (p/default genel güvenlik, p/javascript + p/nodejs + p/react dile özel kalıplar). Bulgular SARIF olarak
# depo > Security > Code scanning alerts'e "semgrep" kategorisiyle yüklenir; iş bulgu yüzünden kırmızı olmaz.
# Ücretli Semgrep hesabı GEREKMEZ: kurallar herkese açık kayıt defterinden çekilir, ölçüm gönderimi kapalı.
# Kapsam dışı: test koşum betikleri (paketlenmez, sabit veriyle çalışır). Kapalı kurallar ve gerekçeleri:
#  - path-join-resolve-traversal (+express sürümü): uploads yolları TEK kapıdan geçiyor (electron/guvenliYol.cjs;
#    testi tests/guvenli-yol.test.js), kural guard'ı göremediği için her dosya işleminde yanlış alarm veriyordu.
#  - express-check-csurf-middleware-usage: API çerez kullanmaz, kimlik yalnız Authorization: Bearer başlığıyla → CSRF konu dışı.
name: semgrep

on:
  push:
  pull_request:
  schedule:
    - cron: "30 7 * * 1" # her Pazartesi 07:30 UTC (codeql'den sonra)
  workflow_dispatch:

jobs:
  tarama:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # SARIF'i Code scanning'e yazar
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Semgrep OSS kur
        run: pip install --disable-pip-version-check semgrep

      - name: Tarama (SARIF üret)
        run: |
          set +e
          semgrep scan \
            --config p/default --config p/javascript --config p/nodejs --config p/react \
            --exclude dist --exclude release --exclude coverage --exclude "*.min.js" \
            --exclude tests --exclude scripts/tests \
            --exclude-rule javascript.lang.security.audit.path-traversal.path-join-resolve-traversal.path-join-resolve-traversal \
            --exclude-rule javascript.express.security.audit.express-path-join-resolve-traversal.express-path-join-resolve-traversal \
            --exclude-rule javascript.express.security.audit.express-check-csurf-middleware-usage.express-check-csurf-middleware-usage \
            --metrics off \
            --sarif --output semgrep.sarif
          kod=$?
          # 0 = bulgu yok, 1 = bulgu var (SARIF'e yazıldı, Security sekmesinde görünür) → ikisi de başarılı;
          # 2 ve üstü gerçek hata (kural indirilemedi, çökme) → iş kırmızı olsun.
          if [ "$kod" -gt 1 ]; then exit "$kod"; fi

      - name: SARIF'i Code scanning'e yükle
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        if: always() # tarama adımı düşse bile üretilmiş bulgular kaybolmasın
        with:
          sarif_file: semgrep.sarif
          category: semgrep
