# Dependabot sürüm güncellemeleri — YALNIZ GitHub Actions.
# Eylemler tedarik zinciri için SHA'ya sabitlendi; sabit SHA kendiliğinden güncellenmez, o yüzden Dependabot takip eder.
# npm paketleri BİLEREK yok: güvenlik açığı çıkarsa Dependabot "security update" PR'ını bu dosyadan bağımsız açar
# (depo ayarında açık), rutin sürüm yükseltmeleri ise elle yapılır (Electron/native modül uyumu test turu ister).
# npm rutin güncellemeleri istenirse buraya package-ecosystem: "npm" bloğu eklenir.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # Yeni yayımlanan sürümler 7 gün bekletilir: ele geçirilmiş/aceleyle yayımlanmış paket riskine karşı.
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
